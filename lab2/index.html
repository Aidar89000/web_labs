<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONPlaceholder Demo App</title>
  <link rel="preconnect" href="https://jsonplaceholder.typicode.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1 class="logo">📜 JSON<span>Posts</span></h1>

      <nav class="tabs" role="tablist" aria-label="Разделы">
        <button class="tabs__btn tabs__btn--active" role="tab" aria-selected="true"  data-tab="posts">Посты</button>
        <button class="tabs__btn" role="tab" aria-selected="false" data-tab="users">Пользователи</button>
        <button class="tabs__btn" role="tab" aria-selected="false" data-tab="todos">Задачи</button>
      </nav>

      <div class="header__actions">
        <input id="search-input" class="search" type="search" placeholder="Поиск..." autocomplete="off">
        <button id="add-btn" class="btn btn--primary" title="Добавить пост">＋ Пост</button>
      </div>
      <span id="status-bar" class="status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="main">
    <section id="panel-posts" class="panel" role="tabpanel" aria-label="Посты">
      <div id="posts-grid" class="grid"></div>
    </section>

    <section id="panel-users" class="panel" role="tabpanel" aria-label="Пользователи" hidden>
      <div id="users-grid" class="grid grid--users"></div>
    </section>

    <section id="panel-todos" class="panel" role="tabpanel" aria-label="Задачи" hidden>
      <div class="todos-filter">
        <button class="btn btn--filter btn--filter-active" data-filter="all">Все</button>
        <button class="btn btn--filter" data-filter="done">Выполненные</button>
        <button class="btn btn--filter" data-filter="active">Активные</button>
        <button id="todos-toggle" class="btn btn--filter btn--ghost">✓ Завершить все</button>
      </div>
      <ul id="todos-list" class="todos"></ul>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-close-modal aria-label="Закрыть">✕</button>
      <h2 id="modal-title" class="modal__title"></h2>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <footer class="footer">
    Данные предоставлены <a href="https://jsonplaceholder.typicode.com/" target="_blank" rel="noopener">JSONPlaceholder</a>
    (клиентский Ajax, без сборки и зависимостей)
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
