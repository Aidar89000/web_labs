<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Посты — лабораторная №2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Посты с JSONPlaceholder</h1>

  <!-- Форма для добавления поста -->
  <form id="form">
    <input id="title" type="text" placeholder="Заголовок" required>
    <input id="body" type="text" placeholder="Текст" required>
    <button type="submit">Добавить</button>
  </form>

  <!-- Здесь показываем состояние: загрузка, ошибка, результат -->
  <p id="status">Загрузка...</p>

  <!-- Сюда JavaScript добавит посты -->
  <ul id="list"></ul>

  <script src="js/app.js"></script>
</body>
</html>
